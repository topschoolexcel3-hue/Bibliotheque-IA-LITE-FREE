const PLATFORMS = {
  chatgpt:{label:"ChatGPT", icon:"🟢", cls:"chatgpt"},
  claude:{label:"Claude", icon:"🟠", cls:"claude"},
  gemini:{label:"Gemini", icon:"🔵", cls:"gemini"},
};
let DATA=null, RAW_CATEGORIES=[], FAMILIES={}, state={
  activeCat:null, activeMeta:"ALL", search:"", globalSearch:false, dedup:false,
  favs:new Set(JSON.parse(localStorage.getItem("fav_commands")||"[]")),
};
const $=id=>document.getElementById(id), navEl=$("nav"), mainEl=$("main"), searchEl=$("search"), metaBarEl=$("meta-bar");
function renderPlatformBadges(catId){
  const sup=PLATFORM_SUPPORT[catId]; if(!sup) return "";
  let h=""; Object.entries(PLATFORMS).forEach(([k,p])=>{
    const lvl=sup[k]; if(lvl===false) return;
    const partial=lvl==="partial"?" partial":""; const suf=lvl==="partial"?" ~":"";
    h+=`<span class="platform-badge ${p.cls}${partial}">${p.icon} ${p.label}${suf}</span>`;
  }); return h;
}
function metaBadge(meta){ return `<span class="meta-badge ${meta.toLowerCase()}">${META_LABELS[meta]?.icon||""} ${meta}</span>`; }
function saveFavs(){ localStorage.setItem("fav_commands", JSON.stringify([...state.favs])); $("fav-count").textContent=state.favs.size; }
function isFav(cmd){ return state.favs.has(cmd.toLowerCase()); }
async function loadData(){
  let json=null;
  const tries=['commands-free.json','commands-master.json','./commands-free.json','./commands-master.json','uploads/commands-free.json','uploads/commands-master.json'];
  for(const p of tries){
    try{
      const res=await fetch(p);
      if(res.ok){ json=await res.json(); console.log('Loaded '+p); break; }
    }catch(e){}
  }
  if(!json){
    mainEl.innerHTML=`<div class="error-box"><strong>⚠️ Erreur chargement</strong><br>Impossible de charger <code>commands-free.json</code><br>Place ce fichier à côté de index.html<br>Puis lance <code>python -m http.server 8000</code><br>Ouvre http://localhost:8000</div>`;
    return;
  }
  buildData(json);
  try{
    const famRes=await fetch('families.json');
    if(famRes.ok){ FAMILIES=await famRes.json(); }
    else {
      const fam2=await fetch('families-free.json');
      if(fam2.ok) FAMILIES=await fam2.json();
    }
  }catch(e){ console.log("families.json not loaded", e); }
  init();
}
function buildData(json){
  RAW_CATEGORIES=json.categories.map(c=>({
    id:c.id, label:c.label, icon:c.icon||"📁", color:c.color||"#7c5cff",
    meta:c.meta||CATEGORY_META[c.id]||"CHATGPT",
    commands:(c.commands||[]).map(x=>({cmd:x.cmd, desc:x.desc, desc_long:x.desc_long||x.desc, catId:c.id, meta:c.meta||CATEGORY_META[c.id]||"CHATGPT"}))
  }));
  DATA={}; RAW_CATEGORIES.forEach(cat=>{
    DATA[cat.id]={label:cat.label, emoji:cat.icon, color:cat.color, meta:cat.meta, description:`${cat.commands.length} commandes • ${META_LABELS[cat.meta]?.desc||""}`, subcategories:[{name:cat.label, commands:cat.commands}]};
  });
}
function init(){
  state.activeCat=RAW_CATEGORIES[0]?.id||null;
  renderMetaTabs(); renderNav(); renderContent(); updateStats();
  searchEl.addEventListener('input', e=>{ state.search=e.target.value; renderContent(); renderMetaTabs(); renderNav(); });
  $("toggle-global-search").addEventListener('change', e=>{ state.globalSearch=e.target.checked; renderContent(); });
  $("btn-dedup").addEventListener('click', ()=>{ state.dedup=!state.dedup; $("btn-dedup").classList.toggle('active', state.dedup); renderContent(); });
  $("btn-export-txt").addEventListener('click', ()=>exportFiltered('txt'));
  $("btn-export-csv").addEventListener('click', ()=>exportFiltered('csv'));
  $("btn-export-json").addEventListener('click', ()=>exportFiltered('json'));
  document.addEventListener('keydown', e=>{
    if(e.key==='/' && document.activeElement!==searchEl){ e.preventDefault(); searchEl.focus(); }
    if(e.key==='Escape'){ searchEl.value=''; state.search=''; renderContent(); renderMetaTabs(); renderNav(); }
  });
  saveFavs();
}
function countAll(){ return RAW_CATEGORIES.reduce((a,c)=>a+c.commands.length,0); }
function filteredCategories(){
  let cats=RAW_CATEGORIES;
  if(state.activeMeta==="VIDEO_PUR"){
    cats=cats.filter(c=>["cinema","effects"].includes(c.id));
  } else if(state.activeMeta==="IMAGE_FLOW"){
    cats=cats.filter(c=>["image","packaging","social-aa"].includes(c.id));
  } else if(state.activeMeta!=="ALL" && state.activeMeta!=="FAV" && state.activeMeta!=="FAMILIES"){
    cats=cats.filter(c=>c.meta===state.activeMeta);
  }
  return cats;
}
function updateStats(){
  $("total-cmds").textContent=countAll().toLocaleString('fr-FR');
  $("total-cats").textContent=RAW_CATEGORIES.length;
}
function renderMetaTabs(){
  const counts={
    ALL:countAll(), 
    FAV:state.favs.size, 
    FAMILIES:Object.keys(FAMILIES).length||1480,
    VIDEO_PUR: RAW_CATEGORIES.filter(c=>["cinema","effects"].includes(c.id)).reduce((a,c)=>a+c.commands.length,0),
    IMAGE_FLOW: RAW_CATEGORIES.filter(c=>["image","packaging","social-aa"].includes(c.id)).reduce((a,c)=>a+c.commands.length,0)
  };
  Object.keys(META_LABELS).forEach(k=>{
    if(!counts[k]){
      if(k!=="ALL" && k!=="FAV" && k!=="FAMILIES" && k!=="VIDEO_PUR" && k!=="IMAGE_FLOW"){
        counts[k]=RAW_CATEGORIES.filter(c=>c.meta===k).reduce((a,c)=>a+c.commands.length,0);
      }
    }
  });
  if(state.search.trim()){
    const q=state.search.toLowerCase();
    const globalCats=state.globalSearch ? RAW_CATEGORIES : filteredCategories();
    const searchCounts={ALL:0, FAV:0, COMM:0, CHATGPT:0, CLAUDE:0, GEMINI_FLOW:0, VIDEO_PUR:0, IMAGE_FLOW:0, FAMILIES:0};
    globalCats.forEach(cat=>{
      const matches=cat.commands.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
      searchCounts.ALL+=matches.length;
      searchCounts[cat.meta]+=matches.length;
      if(["cinema","effects"].includes(cat.id)) searchCounts.VIDEO_PUR+=matches.length;
      if(["image","packaging","social-aa"].includes(cat.id)) searchCounts.IMAGE_FLOW+=matches.length;
      matches.forEach(m=>{ if(isFav(m.cmd)) searchCounts.FAV++; });
    });
    // families search
    if(FAMILIES){
      let famCount=0;
      Object.entries(FAMILIES).forEach(([fam, cmds])=>{
        const match=cmds.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
        if(match.length>0) famCount++;
      });
      searchCounts.FAMILIES=famCount;
    }
    Object.keys(counts).forEach(k=>{ if(state.search.trim() && searchCounts[k]!==undefined) counts[k]=searchCounts[k]; });
  }
  metaBarEl.innerHTML="";
  Object.entries(META_LABELS).forEach(([key, meta])=>{
    const btn=document.createElement('button');
    btn.className='meta-tab'+(state.activeMeta===key?' active':'');
    btn.dataset.meta=key;
    btn.innerHTML=`${meta.icon} ${meta.label} <span class="meta-count">${counts[key]||0}</span>`;
    btn.title=meta.desc||"";
    btn.onclick=()=>{
      state.activeMeta=key;
      if(key!=="FAV" && key!=="FAMILIES"){
        const firstCat=filteredCategories()[0];
        if(firstCat) state.activeCat=firstCat.id;
      }
      renderMetaTabs(); renderNav(); renderContent();
      window.scrollTo({top:0, behavior:'smooth'});
    };
    metaBarEl.appendChild(btn);
  });
}
function renderNav(){
  navEl.innerHTML="";
  if(state.activeMeta==="FAMILIES"){
    // Show families list in sidebar
    const q=state.search.toLowerCase().trim();
    let fams = Object.entries(FAMILIES).sort((a,b)=>b[1].length-a[1].length);
    if(q){
      fams = fams.filter(([fam, cmds])=> fam.toLowerCase().includes(q) || cmds.some(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)));
    }
    fams.slice(0,100).forEach(([fam, cmds])=>{
      const btn=document.createElement('button');
      btn.className='nav-btn'+(state.activeCat===fam?' active':'');
      btn.innerHTML=`<div class="nav-row"><span class="emoji">👨‍👩‍👧‍👦</span><span class="nav-label">${fam}</span><span class="count">${cmds.length}</span></div><div class="badges-row">${metaBadge(cmds[0]?.meta||"CHATGPT")}</div>`;
      btn.onclick=()=>{ state.activeCat=fam; renderNav(); renderContent(); };
      navEl.appendChild(btn);
    });
    return;
  }
  const cats=filteredCategories();
  cats.forEach(cat=>{
    const q=state.search.toLowerCase().trim();
    let visibleCount=cat.commands.length;
    if(q){ visibleCount=cat.commands.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)).length; if(visibleCount===0 && !state.globalSearch) return; }
    if(state.activeMeta==="FAV"){ visibleCount=cat.commands.filter(c=>isFav(c.cmd)).length; if(visibleCount===0) return; }
    const btn=document.createElement('button');
    btn.className='nav-btn'+(state.activeCat===cat.id?' active':'');
    btn.innerHTML=`<div class="nav-row"><span class="emoji">${cat.icon}</span><span class="nav-label">${cat.label}</span><span class="count">${visibleCount}</span></div><div class="badges-row">${renderPlatformBadges(cat.id)} ${metaBadge(cat.meta)}</div>`;
    btn.onclick=()=>{ state.activeCat=cat.id; renderNav(); renderContent(); window.scrollTo({top:0, behavior:'smooth'}); };
    navEl.appendChild(btn);
  });
}

function renderContent(){

  if(!DATA) return;
  const q=state.search.toLowerCase().trim();
  const dedupSeen=new Set();
  mainEl.innerHTML="";

  if(state.activeMeta==="FAMILIES"){
    renderFamiliesView();
    return;
  }
  if(state.activeMeta==="INFO"){
    renderInfoView();
    return;
  }

  let catsToRender=[];
  if(state.globalSearch && q){ catsToRender=filteredCategories(); }
  else{
    if(state.activeMeta==="FAV"){ catsToRender=RAW_CATEGORIES; }
    else{ const active=RAW_CATEGORIES.find(c=>c.id===state.activeCat) || filteredCategories()[0]; catsToRender=active?[active]:[]; }
  }
  let totalVisible=0, allMatches=[];
  catsToRender.forEach(cat=>{
    let cmds=cat.commands;
    if(state.activeMeta==="FAV") cmds=cmds.filter(c=>isFav(c.cmd));
    if(q) cmds=cmds.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
    if(state.dedup){ cmds=cmds.filter(c=>{ const key=c.cmd.toLowerCase().replace(/\s+/g,'-'); if(dedupSeen.has(key)) return false; dedupSeen.add(key); return true; }); }
    totalVisible+=cmds.length;
    allMatches.push({cat, cmds});
  });
  const activeCatObj=RAW_CATEGORIES.find(c=>c.id===state.activeCat);
  const metaInfo=META_LABELS[state.activeMeta];
  const hero=document.createElement('div'); hero.className='hero';
  const heroTitle=state.activeMeta==="FAV" ? `❤️ Favoris — ${totalVisible} commandes` : state.globalSearch && q ? `🔍 Recherche globale "${state.search}" — ${totalVisible} résultats` : `${activeCatObj?.icon||"📁"} <span class="accent-text">${activeCatObj?.label||metaInfo.label}</span> — ${totalVisible} commande${totalVisible>1?'s':''}`;
  const heroDesc=state.activeMeta==="FAV" ? "Tes commandes épinglées. Clique sur ❤️ pour retirer." : q ? `Filtre: <strong>${state.activeMeta}</strong> • Recherche: "${state.search}" • Dédoublonnage: ${state.dedup?'ON':'OFF'}` : `${activeCatObj?.commands.length||0} commandes • ${META_LABELS[activeCatObj?.meta]?.desc||""}`;
  hero.innerHTML=`<h1>${heroTitle}</h1><p>${heroDesc}</p><div class="hero-badges">${state.activeMeta==="ALL" ? Object.values(PLATFORMS).map(p=>`<span class="platform-badge ${p.cls}">${p.icon} ${p.label}</span>`).join('') : metaBadge(state.activeMeta)} ${activeCatObj ? renderPlatformBadges(activeCatObj.id) : ""}</div>`;
  mainEl.appendChild(hero);
  const legend=document.createElement('div'); legend.className='legend';
  legend.innerHTML=`<span class="legend-title">Légende:</span><span class="legend-item"><span class="platform-badge chatgpt">🟢 ChatGPT</span> Full</span><span class="legend-item"><span class="platform-badge claude">🟠 Claude</span> Texte</span><span class="legend-item"><span class="platform-badge gemini">🔵 Gemini</span> Visuel</span><span class="legend-item"><span class="platform-badge chatgpt partial">🟢 ~</span> Partiel</span><span class="legend-item">❤️ Favori • 📋 Copier • ⚡ Prompt</span>`;
  mainEl.appendChild(legend);
  if(totalVisible===0){
    const empty=document.createElement('div'); empty.className='empty';
    empty.innerHTML=`<div class="big">${state.activeMeta==="FAV"?"💔":"🔍"}</div><p>${state.activeMeta==="FAV"?"Aucun favori.<br>Clique sur ❤️ sur une commande.":`Aucune commande ne correspond à « ${state.search} » dans <strong>${state.activeMeta}</strong>`}</p>`;
    mainEl.appendChild(empty); return;
  }
  allMatches.forEach(({cat, cmds})=>{
    if(cmds.length===0) return;
    const block=document.createElement('div'); block.className='cat-block';
    const head=document.createElement('div'); head.className='cat-head';
    head.innerHTML=`<span class="dot" style="background:${cat.color}; box-shadow:0 0 10px ${cat.color}"></span><h3>${cat.icon} ${cat.label}</h3><span class="sub-count">${cmds.length}</span><span class="meta-badge ${cat.meta.toLowerCase()}">${cat.meta}</span><span class="chevron">▼</span>`;
    const grid=document.createElement('div'); grid.className='cmd-grid';
    head.onclick=()=>{ head.classList.toggle('collapsed'); grid.style.display=head.classList.contains('collapsed')?'none':'grid'; };
    cmds.forEach(({cmd, desc, desc_long})=>{
      const card=document.createElement('div'); card.className='cmd'+(isFav(cmd)?' fav':'');
      card.innerHTML=`<div class="cmd-code">${cmd}</div><div class="cmd-desc">${desc}</div><div class="cmd-meta">${metaBadge(cat.meta)} ${renderPlatformBadges(cat.id)}</div><div class="cmd-actions"><button class="btn-icon fav-btn ${isFav(cmd)?'fav-active':''}">${isFav(cmd)?'❤️':'🤍'}</button><button class="btn-icon copy-btn" title="Copier">📋</button><button class="btn-icon prompt-btn" title="Prompt complet">⚡</button></div>`;
      const favBtn=card.querySelector('.fav-btn'), copyBtn=card.querySelector('.copy-btn'), promptBtn=card.querySelector('.prompt-btn');
      favBtn.onclick=e=>{ e.stopPropagation(); const low=cmd.toLowerCase(); if(state.favs.has(low)) state.favs.delete(low); else state.favs.add(low); saveFavs(); renderMetaTabs(); renderNav(); renderContent(); };
      copyBtn.onclick=e=>{ e.stopPropagation(); copyText(cmd); flash(copyBtn,'✓'); };
      promptBtn.onclick=e=>{ e.stopPropagation(); const promptText=`${cmd}\n[CONTEXTE]: ...\n[OBJECTIF]: ${desc_long||desc}\n[CONTRAINTES]: Ton, longueur, format\n[FORMAT]: Liste / Tableau / Paragraphe`; copyText(promptText); flash(promptBtn,'✓'); };
      grid.appendChild(card);
    });
    block.appendChild(head); block.appendChild(grid); mainEl.appendChild(block);
  });

function copyText(text){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>showToast()).catch(()=>{ fallbackCopy(text); showToast(); }); }
  else{ fallbackCopy(text); showToast(); }
}
function fallbackCopy(text){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
let toastTimer;
function showToast(msg="✅ Copié"){
  const t=$("toast"); t.textContent=msg; t.classList.add('show','success'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
function flash(btn, sym){ const orig=btn.textContent; btn.classList.add('copied'); btn.textContent=sym; setTimeout(()=>{ btn.classList.remove('copied'); btn.textContent=orig; },900); }
function getFilteredCommands(){
  const q=state.search.toLowerCase().trim();
  // Si Global coché, on exporte toutes les catégories filtrées par META, sinon seulement la catégorie active
  let cats;
  if(state.activeMeta==="FAV"){
    cats=RAW_CATEGORIES;
  } else if(state.globalSearch){
    cats=filteredCategories();
  } else {
    const active=RAW_CATEGORIES.find(c=>c.id===state.activeCat);
    cats=active?[active]:filteredCategories();
  }
  if(state.activeMeta==="FAMILIES"){
    let all=[]; Object.values(FAMILIES).forEach(arr=>all.push(...arr));
    if(q) all=all.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
    if(state.dedup){
      const seen=new Set();
      all=all.filter(c=>{ const k=c.cmd.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
    }
    return all.map(c=>({...c, family:c.cmd.replace('/','').split('-')[0]}));
  }
  if(state.activeMeta==="INFO"){
    // En mode INFO, exporte tout le FREE ou PRO selon le fichier chargé
    let all=[];
    RAW_CATEGORIES.forEach(cat=>{
      all.push(...cat.commands);
    });
    if(q) all=all.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
    if(state.dedup){
      const seen=new Set();
      all=all.filter(c=>{ const k=c.cmd.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
    }
    return all.map(c=>{
      const cat=RAW_CATEGORIES.find(rc=>rc.commands.some(x=>x.cmd===c.cmd));
      return {...c, category:cat?.label||"", meta:cat?.meta||"", family:c.cmd.replace('/','').split('-')[0]};
    });
  }
  let all=[]; const seen=new Set();
  cats.forEach(cat=>{
    if(!cat) return;
    let cmds=cat.commands;
    if(state.activeMeta==="FAV") cmds=cmds.filter(c=>isFav(c.cmd));
    if(q) cmds=cmds.filter(c=>c.cmd.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q));
    if(state.dedup){ cmds=cmds.filter(c=>{ const k=c.cmd.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; }); }
    all.push(...cmds.map(c=>({...c, category:cat.label, meta:cat.meta, family:c.cmd.replace('/','').split('-')[0]})));
  }); 
  return all;
}
function exportFiltered(format){
  const cmds=getFilteredCommands();
  if(cmds.length===0){ showToast("⚠️ Rien à exporter"); return; }
  let content="", mime="", ext="";
  if(format==='txt'){ content=cmds.map(c=>`${c.cmd} — ${c.desc||c.desc_short||""} [${c.category||c.family}/${c.meta}]`).join("\n"); mime="text/plain"; ext="txt"; }
  else if(format==='csv'){ content="commande,description,categorie,famille,meta\n"+cmds.map(c=>`\"${(c.cmd||"").replace(/\"/g,'\"\"')}\",\"${(c.desc||c.desc_short||"").replace(/\"/g,'\"\"')}\",\"${c.category||""}\",\"${c.family||""}\",\"${c.meta||""}\"`).join("\n"); mime="text/csv"; ext="csv"; }
  else{ content=JSON.stringify({meta:{export:state.activeMeta, search:state.search, count:cmds.length, date:new Date().toISOString()}, commands:cmds}, null, 2); mime="application/json"; ext="json"; }
  const blob=new Blob([content], {type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`bibliotheque-ia-${state.activeMeta.toLowerCase()}-${Date.now()}.${ext}`; a.click(); URL.revokeObjectURL(url); showToast(`📥 Export ${format.toUpperCase()} : ${cmds.length} commandes`);
}
loadData();
